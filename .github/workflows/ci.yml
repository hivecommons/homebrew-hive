name: Tap CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  formula:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Homebrew on Linux
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          if ! command -v brew >/dev/null 2>&1; then
            NONINTERACTIVE=1 CI=1 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          fi
          echo "/home/linuxbrew/.linuxbrew/bin" >> "$GITHUB_PATH"
          echo "/home/linuxbrew/.linuxbrew/sbin" >> "$GITHUB_PATH"

      - name: Validate all formulae (generated and hand-maintained)
        run: |
          set -euo pipefail
          # Style and audit cover every formula; macOS-only formulae such as
          # hotshot are built and tested on macOS by hotshot.yml instead.
          if ls Formula/*.rb >/dev/null 2>&1; then
            brew tap hivecommons/hive "$PWD"
            ruby -c Formula/*.rb
            brew style Formula/*.rb
            for formula_path in Formula/*.rb; do
              formula_name=$(basename "$formula_path" .rb)
              brew audit --strict --new "hivecommons/hive/${formula_name}"
            done
          else
            echo "No formulae yet."
          fi

      - name: Install and test contribute formula when present
        if: ${{ hashFiles('Formula/contribute.rb') != '' }}
        run: |
          set -euo pipefail
          brew install --build-from-source hivecommons/hive/contribute
          hive-contribute --help
          brew test hivecommons/hive/contribute

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run generator unit tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
