name: Tap CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  formula:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Homebrew on Linux
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          if ! command -v brew >/dev/null 2>&1; then
            NONINTERACTIVE=1 CI=1 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/eaa2af62ca1d5349c9743f82b1b0c4e5d365fb2d/install.sh)" # pinned 2026-11-18
          fi
          echo "/home/linuxbrew/.linuxbrew/bin" >> "$GITHUB_PATH"
          echo "/home/linuxbrew/.linuxbrew/sbin" >> "$GITHUB_PATH"

      - name: Validate all formulae (generated and hand-maintained)
        run: |
          set -euo pipefail
          # Style and audit cover every formula; macOS-only formulae such as
          # hotshot are built and tested on macOS by hotshot.yml instead.
          if ls Formula/*.rb >/dev/null 2>&1; then
            brew tap hivecommons/hive "$PWD"
            # Homebrew now refuses to load formulae from non-official taps until trusted.
            brew trust hivecommons/hive 2>/dev/null || true
            ruby -c Formula/*.rb
            brew style Formula/*.rb
            for formula_path in Formula/*.rb; do
              formula_name=$(basename "$formula_path" .rb)
              brew audit --strict --new "hivecommons/hive/${formula_name}"
            done
          else
            echo "No formulae yet."
          fi

      - name: Install and test contribute formula when present
        if: ${{ hashFiles('Formula/contribute.rb') != '' }}
        run: |
          set -euo pipefail
          brew install --build-from-source hivecommons/hive/contribute
          hive-contribute --help
          brew test hivecommons/hive/contribute

  cask:
    # Casks are macOS-only, so they cannot be audited on the Linux formula job.
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Checkout tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Audit casks
        run: |
          set -euo pipefail
          brew tap hivecommons/hive "$PWD"
          # Homebrew now refuses to load casks from non-official taps until trusted.
          brew trust hivecommons/hive 2>/dev/null || true
          ruby -c Casks/*.rb
          brew style Casks/*.rb
          # audit --cask downloads the archive and checks it against the pinned sha256.
          for cask_path in Casks/*.rb; do
            cask_name=$(basename "$cask_path" .rb)
            brew audit --cask --strict "hivecommons/hive/${cask_name}"
          done

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run generator unit tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
