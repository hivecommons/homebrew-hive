name: Convert Hive contributor image

on:
  push:
    branches: [main]
    paths:
      - scripts/generate-formula.py
      - scripts/contribute-wrapper.sh.in
      - .github/workflows/convert.yml
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      channel:
        description: Image channel to convert
        type: choice
        options: [stable, candidate]
        default: stable
      force:
        description: Rebuild and republish even if the release already exists
        type: boolean
        default: false
  repository_dispatch:
    types: [hive-contributor-promoted, promote-stable]

permissions: {}

concurrency:
  group: convert-hive-contributor-${{ github.event.inputs.channel || github.event.client_payload.channel || 'stable' }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/hivecommons/hive-contributor
  DEFAULT_CHANNEL: stable

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      channel: ${{ steps.meta.outputs.channel }}
      digest: ${{ steps.meta.outputs.digest }}
      short: ${{ steps.meta.outputs.short }}
      tag: ${{ steps.meta.outputs.tag }}
      formula: ${{ steps.meta.outputs.formula }}
      binary: ${{ steps.meta.outputs.binary }}
      version: ${{ steps.meta.outputs.version }}
      image_ref: ${{ steps.meta.outputs.image_ref }}
      exists: ${{ steps.exists.outputs.exists }}
    steps:
      - name: Resolve channel digest
        id: meta
        env:
          INPUT_CHANNEL: ${{ github.event.inputs.channel || github.event.client_payload.channel || '' }}
        run: |
          set -euo pipefail
          channel="${INPUT_CHANNEL:-$DEFAULT_CHANNEL}"
          case "$channel" in stable|candidate) ;; *) echo "unsupported channel: $channel" >&2; exit 2 ;; esac
          inspect=$(docker buildx imagetools inspect "$IMAGE:$channel" --format '{{json .}}')
          digest=$(jq -r '.Manifest.Digest // .manifest.digest // empty' <<<"$inspect")
          if ! [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "could not resolve digest for $IMAGE:$channel" >&2
            echo "$inspect" >&2
            exit 1
          fi
          short="${digest#sha256:}"
          short="${short:0:12}"
          if [ "$channel" = stable ]; then
            tag="contribute-${short}"
            version="${short}"
            formula=contribute
            binary=hive-contribute
          else
            tag="contribute-candidate-${short}"
            version="candidate-${short}"
            formula=contribute-candidate
            binary=hive-contribute-candidate
          fi
          {
            echo "channel=$channel"
            echo "digest=$digest"
            echo "short=$short"
            echo "tag=$tag"
            echo "version=$version"
            echo "formula=$formula"
            echo "binary=$binary"
            echo "image_ref=$IMAGE@$digest"
          } >> "$GITHUB_OUTPUT"

      - name: Check for existing release
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.meta.outputs.tag }}
          FORCE: ${{ github.event.inputs.force || (github.event_name == 'push' && 'true') || 'false' }}
        run: |
          set -euo pipefail
          if [ "$FORCE" = "true" ]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          elif gh release view "$TAG" --json tagName >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release $TAG already exists; nothing to do."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: resolve
    if: needs.resolve.outputs.exists != 'true'
    timeout-minutes: 45
    permissions: {}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Install Apptainer
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y software-properties-common squashfs-tools
          sudo add-apt-repository -y ppa:apptainer/ppa
          for i in 1 2 3 4 5; do
            if sudo apt-get update && sudo apt-get install -y apptainer; then
              break
            fi
            if [ "$i" = 5 ]; then
              exit 1
            fi
            sleep $((10 * i))
          done
          apptainer --version

      - name: Build SIF from pinned image digest
        env:
          IMAGE_REF: ${{ needs.resolve.outputs.image_ref }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          asset="hive-contributor-${ARCH}.sif"
          apptainer build "$asset" "docker://$IMAGE_REF"
          bytes=$(stat -c '%s' "$asset")
          limit=$((2 * 1024 * 1024 * 1024))
          if [ "$bytes" -ge "$limit" ]; then
            echo "::error::$asset is $bytes bytes, exceeding GitHub's 2GB release asset limit"
            exit 1
          fi
          sha256sum "$asset" > "$asset.sha256"
          cat "$asset.sha256"

      - name: Upload SIF artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hive-contributor-${{ matrix.arch }}
          path: |
            hive-contributor-${{ matrix.arch }}.sif
            hive-contributor-${{ matrix.arch }}.sif.sha256
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [resolve, build]
    if: needs.resolve.outputs.exists != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download SIF artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Publish release assets
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
          CHANNEL: ${{ needs.resolve.outputs.channel }}
          DIGEST: ${{ needs.resolve.outputs.digest }}
          IMAGE_REF: ${{ needs.resolve.outputs.image_ref }}
          FORCE: ${{ github.event.inputs.force || (github.event_name == 'push' && 'true') || 'false' }}
        run: |
          set -euo pipefail
          notes="Hive contributor ${CHANNEL} converted to Apptainer SIF.\n\nImage: ${IMAGE_REF}\nDigest: ${DIGEST}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            if [ "$FORCE" != "true" ]; then
              echo "::error::Release $TAG already exists; refusing to clobber its assets (rerun with force=true to override)"
              exit 1
            fi
            gh release upload "$TAG" dist/*.sif dist/*.sha256 --clobber
            gh release edit "$TAG" --title "$TAG" --notes "$notes"
          else
            gh release create "$TAG" dist/*.sif dist/*.sha256 \
              --title "$TAG" \
              --notes "$notes"
          fi
          echo "url=https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}" >> "$GITHUB_OUTPUT"

      - name: Generate formula
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
          VERSION: ${{ needs.resolve.outputs.version }}
          CHANNEL: ${{ needs.resolve.outputs.channel }}
          DIGEST: ${{ needs.resolve.outputs.digest }}
          IMAGE_REF: ${{ needs.resolve.outputs.image_ref }}
          FORMULA: ${{ needs.resolve.outputs.formula }}
          BINARY: ${{ needs.resolve.outputs.binary }}
        run: |
          set -euo pipefail
          amd_sha=$(cut -d' ' -f1 dist/hive-contributor-amd64.sif.sha256)
          arm_sha=$(cut -d' ' -f1 dist/hive-contributor-arm64.sif.sha256)
          ./scripts/generate-formula.py \
            --formula "$FORMULA" \
            --binary "$BINARY" \
            --channel "$CHANNEL" \
            --version "$VERSION" \
            --digest "$DIGEST" \
            --image-ref "$IMAGE_REF" \
            --amd64-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/hive-contributor-amd64.sif" \
            --amd64-sha256 "$amd_sha" \
            --arm64-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/hive-contributor-arm64.sif" \
            --arm64-sha256 "$arm_sha" \
            --output "Formula/${FORMULA}.rb"

      - name: Smoke generated wrapper syntax
        run: |
          set -euo pipefail
          ruby -c Formula/*.rb
          grep -R -- "--wrapper-version" Formula/*.rb

      - name: Validate generated formula like Tap CI
        env:
          FORMULA: ${{ needs.resolve.outputs.formula }}
          BINARY: ${{ needs.resolve.outputs.binary }}
        run: |
          set -euo pipefail
          # This job holds a write token, so never bootstrap brew from a remote
          # script here: use the runner image's Homebrew or fail the step.
          export PATH="/home/linuxbrew/.linuxbrew/bin:/home/linuxbrew/.linuxbrew/sbin:$PATH"
          command -v brew >/dev/null 2>&1 || { echo "::error::brew is not on the runner image; cannot validate the generated formula" >&2; exit 1; }
          # `brew tap <path>` clones committed HEAD, so overlay the uncommitted
          # generated formula into the tap before auditing it.
          brew tap hivecommons/hive "$PWD"
          mkdir -p "$(brew --repository hivecommons/hive)/Formula"
          cp "Formula/${FORMULA}.rb" "$(brew --repository hivecommons/hive)/Formula/${FORMULA}.rb"
          brew style "Formula/${FORMULA}.rb"
          brew audit --strict --new "hivecommons/hive/${FORMULA}"
          brew install --build-from-source "hivecommons/hive/${FORMULA}"
          "$BINARY" --help
          brew test "hivecommons/hive/${FORMULA}"

      - name: Commit generated formula
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
          CHANNEL: ${{ needs.resolve.outputs.channel }}
          DIGEST: ${{ needs.resolve.outputs.digest }}
          FORMULA: ${{ needs.resolve.outputs.formula }}
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- Formula)" ]; then
            echo "Formula already up to date."
            exit 0
          fi
          # One long-lived branch per channel: each run force-pushes the newest
          # formula onto it and edits the existing PR instead of opening a new
          # PR per tag, which left one unmerged PR behind every 6-hour run.
          branch="generated/${FORMULA}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add Formula
          git commit -s -m "🌱 tap: generate ${CHANNEL} contribute formula" \
            -m "Image digest: ${DIGEST}" \
            -m "Co-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>"
          git push --force origin "$branch"
          title="✨ tap: generated ${FORMULA} formula ${TAG}"
          body="Generated Formula/${FORMULA}.rb for ${TAG}.\n\nImage digest: ${DIGEST}\nRelease: ${{ steps.release.outputs.url }}"
          existing=$(gh pr list --head "$branch" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --title "$title" --body "$body"
          else
            existing=$(gh pr create --head "$branch" --base main --title "$title" --body "$body" | grep -oE '[0-9]+$')
          fi
          # Retire per-tag PRs from earlier runs of this channel; the branch
          # above now carries their content.
          gh pr list --state open --json number,headRefName \
            --jq ".[] | select(.headRefName | startswith(\"generated/${FORMULA}-\")) | .number" |
          while read -r stale; do
            [ "$stale" = "$existing" ] && continue
            gh pr close "$stale" --delete-branch \
              --comment "Superseded by #${existing}: the ${CHANNEL} formula now tracks a single branch (\`${branch}\`)."
          done

  notify-failure:
    needs: [resolve, build, publish]
    if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write
    steps:
      - name: Open or update the tracking issue on failure, close it on success
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RESULTS: ${{ needs.resolve.result }} ${{ needs.build.result }} ${{ needs.publish.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="Convert pipeline failing"
          existing=$(gh issue list --state open --search "\"$title\" in:title" --json number,title \
            --jq "[.[] | select(.title == \"$title\")][0].number // empty")
          if [[ " $RESULTS " == *" failure "* ]]; then
            body="The \`${GITHUB_WORKFLOW}\` run failed (resolve/build/publish: ${RESULTS}): ${RUN_URL}"
            if [ -n "$existing" ]; then
              gh issue comment "$existing" --body "$body"
            else
              gh issue create --title "$title" \
                --body "$body"$'\n\n'"See runbooks/convert-stalled.md. This issue closes automatically when a later scheduled run succeeds."
            fi
          elif [[ " $RESULTS " != *" cancelled "* && "$GITHUB_EVENT_NAME" = schedule && -n "$existing" ]]; then
            gh issue close "$existing" --comment "Scheduled run succeeded: ${RUN_URL}"
          fi
