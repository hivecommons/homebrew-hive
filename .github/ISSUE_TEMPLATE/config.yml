blank_issues_enabled: true
contact_links:
  - name: Report a security vulnerability
    url: https://github.com/hivecommons/.github/blob/main/SECURITY.md
    about: Please do not file vulnerabilities as public issues. Follow the Hive Commons security policy instead.
  - name: Contributor relay problems
    url: https://github.com/hivecommons/hive/blob/v5/src/docs/contributor-relay.md
    about: The relay that hive-contribute runs is developed in hivecommons/hive. Check its docs and file relay bugs there.
  - name: hotshot app bugs and features
    url: https://github.com/hivecommons/hotshot/issues/new/choose
    about: If hotshot installs but the app misbehaves, report it in hivecommons/hotshot. Use the bug form here for brew install/test failures.
  - name: crux runtime bugs and features
    url: https://github.com/hivecommons/hive/issues/new/choose
    about: Crux's code is developed in hivecommons/hive. Report runtime problems there; use the bug form here for brew install/test failures.
  - name: Join our Discord
    url: https://hivecommons.dev/discord
    about: Ask setup, contributor, and community questions in the Hive Commons Discord.
  - name: Propose a project to join Hive Commons
    url: https://github.com/hivecommons/.github/issues/new?template=join-hive-commons.yml
    about: Project proposals for the Hive Commons family are handled in the hivecommons/.github repository.
