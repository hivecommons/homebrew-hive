name: Bug report
description: Report a problem installing a formula from this tap (contribute, hotshot or crux) or running hive-contribute
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem.
        **Do not paste credentials.** The wrapper forwards `GH_TOKEN` / `GITHUB_TOKEN`, `HIVE_REGISTRATION_TOKEN`
        and backend provider API keys into the container, so remove their values from everything below,
        including logs and `env` output. For security vulnerabilities, follow
        [SECURITY.md](https://github.com/hivecommons/.github/blob/main/SECURITY.md) instead of filing an issue.

        This repo owns the formulae, the `hive-contribute` wrapper and the SIF conversion. Problems in the
        contributor relay itself (task handling, registration, backend CLIs) belong in
        [hivecommons/hive](https://github.com/hivecommons/hive/issues). If `hotshot` or `crux` installs
        fine but the program misbehaves, report it upstream:
        [hivecommons/hotshot](https://github.com/hivecommons/hotshot/issues/new/choose) for hotshot,
        [hivecommons/hive](https://github.com/hivecommons/hive/issues/new/choose) for crux.
  - type: dropdown
    id: formula
    attributes:
      label: Formula
      options:
        - contribute (hive-contribute)
        - hotshot
        - crux
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Linux amd64
        - Linux arm64
        - macOS Apple silicon
        - macOS Intel
        - Windows (WSL2)
        - Other
    validations:
      required: true
  - type: dropdown
    id: stage
    attributes:
      label: Where did it fail?
      options:
        - brew tap / brew install
        - brew test or brew upgrade
        - hive-contribute fails to start the container
        - hive-contribute starts, but the relay misbehaves
        - Formula generation or conversion workflow (maintainers)
        - Other
    validations:
      required: true
  - type: dropdown
    id: runtime
    attributes:
      label: Runtime
      description: For contribute, the output of `hive-contribute --wrapper-print-runtime`, or the `HIVE_CONTRIBUTE_RUNTIME` value you set.
      options:
        - apptainer
        - docker
        - podman
        - lima
        - gvisor
        - none / not reached
        - not applicable (hotshot or crux)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: For contribute, the output of `hive-contribute --wrapper-version` (version, channel and pinned image). Otherwise, the formula version from `brew info hivecommons/hive/<formula>`.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The commands you ran, including any `HIVE_CONTRIBUTE_*` variables you set.
      placeholder: |
        1. brew install hivecommons/hive/contribute
        2. hive-contribute
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead, including any error message.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Output or logs
      description: Relevant `brew`, `hive-contribute`, `hotshot` or `crux` output. Redact tokens and API keys first.
      render: shell
