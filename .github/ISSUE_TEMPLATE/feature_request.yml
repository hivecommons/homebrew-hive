name: Feature request
description: Suggest an improvement to a formula in this tap, the hive-contribute wrapper, or the release automation
title: "feature: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        `Formula/contribute*.rb` is generated output, so changes to it land in `scripts/generate-formula.py`,
        `scripts/contribute-wrapper.sh.in` or the conversion workflow. `Formula/hotshot.rb` and
        `Formula/crux.rb` are hand-maintained (see [`Formula/README.md`](https://github.com/hivecommons/homebrew-hive/blob/main/Formula/README.md)).
        Requests for the contributor relay itself belong in [hivecommons/hive](https://github.com/hivecommons/hive/issues);
        requests for the hotshot or crux programs belong in
        [hivecommons/hotshot](https://github.com/hivecommons/hotshot/issues/new/choose) or
        [hivecommons/hive](https://github.com/hivecommons/hive/issues/new/choose).
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Installation (formula, platforms, dependencies)
        - hive-contribute wrapper (runtimes, mounts, forwarded environment)
        - Release channels and conversion automation
        - hotshot or crux formula
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: use-case
    attributes:
      label: Use case
      description: What problem are you trying to solve, and on which platform?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds or other designs you have considered.
  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility
      description: Would this change the installed command name, the `HIVE_CONTRIBUTE_*` variables, the mounted paths, or what existing installs get on `brew upgrade`?
